<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Illustration Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../admin.css"></head><body><main class="shell"><a class="back" href="../">← На сайт</a><header><div class="eyebrow">ILLUSTRATION PORTFOLIO</div><h1>Керування роботами</h1><p>Увійди, щоб змінювати портфоліо.</p></header>
<section id="login-panel" class="panel"><form id="login-form"><label class="field">Email<input name="email" type="email" autocomplete="username" required></label><label class="field">Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="submit">Увійти <span>→</span></button><div id="login-message" role="status"></div></form></section>
<section id="admin-panel" hidden><div class="manage-head"><span id="signed-in"></span><button id="sign-out" class="delete">Вийти</button></div><form id="work-form"><label class="upload" for="image"><span class="upload-icon">＋</span><strong id="file-label">Завантаж зображення</strong><small>JPG, PNG, WEBP або GIF · до 8 МБ</small><img id="preview" alt="Попередній перегляд" hidden></label><input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><label class="field">Назва роботи<input name="title" maxlength="80" placeholder="Наприклад, Pink Dreams" required></label><label class="field">Категорія<select name="category" required><option value="portrait">Портрети</option><option value="illustration">Ілюстрації</option><option value="character">Персонажі</option></select></label><button class="submit" type="submit">Опублікувати роботу <span>→</span></button><div id="form-message" role="status"></div></form><section class="manage"><div class="manage-head"><h2>Роботи на сайті</h2><span id="count"></span></div><div id="works" class="works"></div></section></section><footer>Опубліковані роботи одразу видно відвідувачам.</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="admin.js"></script></body></html>
